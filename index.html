<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mochi the Chubby Cat 🐾</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #fcf7f1;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      color: #483026;
      min-height: 100vh;
      transition: background 0.3s ease;
    }
    body.dark {
      background: #1c1826;
      color: #f5ebe1;
    }
    .header-bar {
      width: 100%;
      max-width: 685px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .dl-btn {
      background: #fa964b;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      padding: 10px 18px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(250, 150, 75, 0.35);
      transition: all 0.2s ease;
    }
    .dl-btn:hover {
      background: #e67d32;
      transform: translateY(-2px);
    }
    canvas {
      border: 2px solid #ecd4be;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      cursor: pointer;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 685px;
      margin-top: 14px;
    }
    .btn {
      background: #fff2e6;
      border: 1px solid #e8be9a;
      border-radius: 8px;
      padding: 10px 0;
      color: #483026;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    body.dark .btn {
      background: #2b2234;
      border-color: #4f3a5f;
      color: #f5ebe1;
    }
    .btn:hover { transform: translateY(-2px); }
  </style>
</head>
<body>

  <div class="header-bar">
    <div>
      <h1 style="font-size: 24px;">Mochi the Chubby Cat 🐾</h1>
      <p style="font-size: 13px; opacity: 0.8;">Click the lamp to toggle Dark Mode!</p>
    </div>
    <a href="cat.exe" download class="dl-btn">💻 Download cat.exe</a>
  </div>

  <canvas id="gameCanvas" width="685" height="350"></canvas>

  <div class="controls">
    <button class="btn" onclick="feedCat()"><span>🐟</span><span>Treat</span></button>
    <button class="btn" onclick="playCat()"><span>🧶</span><span>Yarn</span></button>
    <button class="btn" onclick="boxCat()"><span>📦</span><span>Box</span></button>
    <button class="btn" onclick="catnipCat()"><span>🌿</span><span>Catnip</span></button>
    <button class="btn" onclick="zoomiesCat()"><span>💨</span><span>Zoomies</span></button>
    <button class="btn" onclick="napCat()"><span>💤</span><span>Nap</span></button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let lampOn = true;
    let cat = {
      name: "Mochi",
      happiness: 88,
      fullness: 70,
      energy: 85,
      weight: 6.2,
      mood: 0,
      moodTimer: 0,
      posX: 215,
      dirX: 1
    };

    let animTimer = 0;
    let fishSwim = 0;
    let yarnBounce = 0;
    let statusMessage = "Mochi happily loafs on her rug. Click the standing lamp to toggle lights!";
    let particles = [];

    function spawnPop(x, y, text, color) {
      particles.push({ x, y, vy: -1.4, life: 35, text, color });
    }

    function soundBeep(freq, duration) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function toggleLamp() {
      lampOn = !lampOn;
      document.body.classList.toggle("dark", !lampOn);
      soundBeep(1100, 0.04);
      setTimeout(() => soundBeep(800, 0.05), 50);
      if (lampOn) {
        statusMessage = "*Click!* Warm morning light fills the room. Good morning, Mochi!";
        spawnPop(385, 150, "LIGHTS ON", "#ffc83c");
      } else {
        statusMessage = "*Click!* Cozy dark mode activated. The moon and stars shine outside.";
        spawnPop(385, 150, "DARK MODE", "#a0b4f0");
      }
    }

    function feedCat() {
      if (cat.fullness >= 95) {
        statusMessage = "Mochi pats her round belly. Fully packed with salmon!";
        spawnPop(cat.posX, 135, "FULL!", "#eb8c3c");
      } else {
        cat.fullness = Math.min(100, cat.fullness + 20);
        cat.happiness = Math.min(100, cat.happiness + 10);
        cat.weight += 0.15;
        cat.mood = 4;
        cat.moodTimer = 60;
        spawnPop(350, 210, "🐟 YUM!", "#ff7a62");
        spawnPop(cat.posX, 135, "+CHONK!", "#f58c32");
        statusMessage = "*Crunch crunch!* Mochi ate fresh salmon & shrimp! (+0.15 kg Chonk)";
        soundBeep(440, 0.1);
      }
    }

    function playCat() {
      if (cat.energy < 20) {
        statusMessage = "Mochi is out of battery. She needs a warm catnap.";
        spawnPop(cat.posX, 135, "TIRED", "#999");
      } else {
        cat.energy = Math.max(0, cat.energy - 25);
        cat.fullness = Math.max(0, cat.fullness - 15);
        cat.happiness = Math.min(100, cat.happiness + 20);
        cat.mood = 1;
        cat.moodTimer = 50;
        yarnBounce = 20;
        statusMessage = "Mochi batted the pink yarn ball and did a cute somersault!";
        spawnPop(cat.posX, 125, "POUNCE!", "#ff5fa0");
        soundBeep(880, 0.08);
      }
    }

    function boxCat() {
      cat.mood = 3;
      cat.moodTimer = 100;
      cat.happiness = Math.min(100, cat.happiness + 15);
      statusMessage = "If it fits, I sits! Her round fur spills over the box rim.";
      spawnPop(cat.posX, 125, "I SITS!", "#af7d4b");
      soundBeep(320, 0.12);
    }

    function catnipCat() {
      cat.mood = 5;
      cat.moodTimer = 110;
      cat.energy = 100;
      cat.happiness = 100;
      statusMessage = "🌿 CATNIP PARTY! Mochi's emerald eyes went completely wide!";
      spawnPop(cat.posX, 115, "HYPER!!", "#5ac373");
      soundBeep(600, 0.05); setTimeout(() => soundBeep(900, 0.08), 60);
    }

    function zoomiesCat() {
      if (cat.energy < 30) {
        statusMessage = "Too chonky to zoom without a nap. Give catnip or sleep first!";
      } else {
        cat.mood = 2;
        cat.moodTimer = 90;
        cat.energy -= 30;
        cat.happiness = 100;
        statusMessage = "💨 CAT ZOOMIES! Mochi is galloping across the room!";
        spawnPop(cat.posX, 115, "ZOOM!!", "#eb4b4b");
        soundBeep(700, 0.1);
      }
    }

    function napCat() {
      cat.energy = Math.min(100, cat.energy + 40);
      cat.fullness = Math.max(0, cat.fullness - 10);
      cat.mood = 4;
      cat.moodTimer = 80;
      statusMessage = "Mochi curled into a round loaf and drifted off to sleep.";
      spawnPop(cat.posX, 125, "zzz...", "#78b4f0");
      soundBeep(260, 0.2);
    }

    canvas.addEventListener("click", (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const cx = cat.posX;

      // Lamp Click
      if (mx >= 370 && mx <= 420 && my >= 90 && my <= 230) {
        toggleLamp();
      } else if (mx >= 45 && mx <= 115 && my >= 160 && my <= 250) {
        spawnPop(80, 160, "SPLASH! 🐠", "#4baff5");
        statusMessage = "🐠 The goldfish did a flip! Mochi's emerald eyes lit up.";
        soundBeep(600, 0.08);
      } else if (mx >= 115 && mx <= 155 && my >= 220 && my <= 260) {
        yarnBounce = 22;
        spawnPop(135, 220, "BOING!", "#ff69a0");
        statusMessage = "🧶 You flicked the pink yarn ball across the floorboards!";
        soundBeep(750, 0.06);
      } else if (mx >= 320 && mx <= 365 && my >= 210 && my <= 255) {
        feedCat();
      } else if (Math.abs(mx - cx) < 16 && Math.abs(my - 198) < 12) {
        spawnPop(cx, 180, "BOOP! ♥", "#ff82a0");
        statusMessage = "👉 *BOOP!* You tapped her soft pink button nose!";
        soundBeep(880, 0.08);
      } else if (Math.abs(mx - cx) < 40 && my > 210 && my < 265) {
        if (Math.random() < 0.3) {
          statusMessage = "😼 TRAP! Mochi playfully bunny-kicked your hand!";
          spawnPop(cx, 220, "NIP!", "#e65050");
          soundBeep(220, 0.12);
        } else {
          statusMessage = "Mochi allows warm belly rubs on her soft tummy.";
          spawnPop(cx, 220, "PURRRR", "#ff78a0");
          soundBeep(330, 0.15);
          cat.mood = 4;
          cat.moodTimer = 60;
        }
      }
    });

    function drawMeter(x, y, w, h, val, color, label) {
      ctx.fillStyle = lampOn ? "#483026" : "#f5ebe1";
      ctx.font = "12px Segoe UI";
      ctx.fillText(label, x, y - 6);
      ctx.fillText(`${val}%`, x + w - 30, y - 6);

      ctx.fillStyle = lampOn ? "#f2ece6" : "#282030";
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 4);
      ctx.fill();

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(x, y, (w * val) / 100, h, 4);
      ctx.fill();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Wall & Floor (Day vs Night)
      ctx.fillStyle = lampOn ? "#fcf7f1" : "#1c1826";
      ctx.fillRect(0, 0, canvas.width, 175);
      ctx.fillStyle = lampOn ? "#e2b98e" : "#302622";
      ctx.fillRect(0, 175, canvas.width, 175);

      ctx.strokeStyle = lampOn ? "#bc8e66" : "#221a18";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, 175);
      ctx.lineTo(canvas.width, 175);
      ctx.stroke();

      // Window
      ctx.fillStyle = lampOn ? "#b4e2fc" : "#0c0e1c";
      ctx.fillRect(45, 20, 95, 95);
      if (lampOn) {
        ctx.fillStyle = "#ffeb78";
        ctx.beginPath();
        ctx.arc(115, 45, 16, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = "#f5f0be";
        ctx.beginPath();
        ctx.arc(115, 45, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#0c0e1c";
        ctx.beginPath();
        ctx.arc(110, 45, 13, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.strokeStyle = lampOn ? "#fff" : "#554b5f";
      ctx.lineWidth = 4;
      ctx.strokeRect(45, 20, 95, 95);
      ctx.beginPath();
      ctx.moveTo(92, 20); ctx.lineTo(92, 115);
      ctx.moveTo(45, 67); ctx.lineTo(140, 67);
      ctx.stroke();

      // Oval Rug
      ctx.fillStyle = lampOn ? "#ffdab6" : "#4c3244";
      ctx.strokeStyle = lampOn ? "#fff0e1" : "#5f4154";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(225, 250, 130, 60, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Stand & Aquarium
      ctx.fillStyle = lampOn ? "#a57350" : "#4b2d1e";
      ctx.beginPath();
      ctx.roundRect(64, 235, 52, 45, 4);
      ctx.fill();
      ctx.fillStyle = lampOn ? "#b6e6ff" : "#466e8c";
      ctx.beginPath();
      ctx.ellipse(90, 215, 24, 18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = lampOn ? "#8cc8eb" : "#5a82a0";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Goldfish
      const fishX = 90 + Math.sin(fishSwim) * 11;
      const fishY = 215 + Math.cos(fishSwim * 1.6) * 4;
      ctx.fillStyle = "#ff7630";
      ctx.beginPath();
      ctx.ellipse(fishX, fishY, 6, 3, 0, 0, Math.PI * 2);
      ctx.fill();

      // Grey Ceramic Bowl
      const bx = 345, by = 250;
      ctx.fillStyle = "#afb4bc";
      ctx.beginPath();
      ctx.ellipse(bx, by, 24, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#8e949e";
      ctx.beginPath();
      ctx.ellipse(bx, by, 19, 9, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ff7a62";
      ctx.beginPath();
      ctx.ellipse(bx - 4, by, 8, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Pink Yarn
      const yy = 260 - yarnBounce;
      ctx.fillStyle = "#ff66a0";
      ctx.beginPath();
      ctx.arc(120, yy, 13, 0, Math.PI * 2);
      ctx.fill();

      // Interactive Standing Lamp
      const lx = 390;
      ctx.fillStyle = "#4b3c34";
      ctx.beginPath();
      ctx.ellipse(lx, 225, 18, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#6e5f55";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(lx, 225);
      ctx.lineTo(lx, 120);
      ctx.stroke();

      ctx.fillStyle = lampOn ? "#ffeb96" : "#bea7a0";
      ctx.beginPath();
      ctx.moveTo(lx - 12, 100); ctx.lineTo(lx + 12, 100);
      ctx.lineTo(lx + 22, 124); ctx.lineTo(lx - 22, 124);
      ctx.closePath();
      ctx.fill();

      // The Chubby Cat
      const cx = cat.posX;
      const breathe = Math.sin(animTimer * 2.2) * 3;
      const tailWag = Math.sin(animTimer * 2.5) * 12;

      ctx.strokeStyle = "#fca84c";
      ctx.lineWidth = 14;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(cx + 45, 235);
      ctx.lineTo(cx + 80 + tailWag, 205);
      ctx.stroke();

      ctx.fillStyle = "#fca84c";
      ctx.beginPath();
      ctx.ellipse(cx, 220 + breathe, 72, 60, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#fff0de";
      ctx.beginPath();
      ctx.ellipse(cx, 230 + breathe, 44, 45, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(cx - 22, 265 + breathe, 14, 10, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + 22, 265 + breathe, 14, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#fca84c";
      ctx.beginPath();
      ctx.moveTo(cx - 45, 170); ctx.lineTo(cx - 25, 135); ctx.lineTo(cx - 10, 168);
      ctx.moveTo(cx + 10, 168); ctx.lineTo(cx + 25, 135); ctx.lineTo(cx + 45, 170);
      ctx.fill();
      ctx.fillStyle = "#ff96a5";
      ctx.beginPath();
      ctx.moveTo(cx - 38, 170); ctx.lineTo(cx - 25, 145); ctx.lineTo(cx - 15, 168);
      ctx.moveTo(cx + 15, 168); ctx.lineTo(cx + 25, 145); ctx.lineTo(cx + 38, 170);
      ctx.fill();

      ctx.fillStyle = "#fca84c";
      ctx.beginPath();
      ctx.ellipse(cx, 180, 52, 42, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#d67024";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx - 14, 150); ctx.lineTo(cx - 10, 160); ctx.lineTo(cx, 155); ctx.lineTo(cx + 10, 160); ctx.lineTo(cx + 14, 150);
      ctx.stroke();

      ctx.fillStyle = "#fff0de";
      ctx.beginPath();
      ctx.ellipse(cx, 192, 22, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ff96a5";
      ctx.beginPath();
      ctx.moveTo(cx - 5, 188); ctx.lineTo(cx + 5, 188); ctx.lineTo(cx, 194);
      ctx.fill();

      if (cat.mood === 4) {
        ctx.strokeStyle = "#483026";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx - 28, 178); ctx.lineTo(cx - 14, 178);
        ctx.moveTo(cx + 14, 178); ctx.lineTo(cx + 28, 178);
        ctx.stroke();
      } else {
        ctx.fillStyle = "#5cc480";
        ctx.beginPath();
        ctx.ellipse(cx - 22, 176, 9, 11, 0, 0, Math.PI * 2);
        ctx.ellipse(cx + 22, 176, 9, 11, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#1e1819";
        ctx.beginPath();
        ctx.ellipse(cx - 22, 176, 4, 8, 0, 0, Math.PI * 2);
        ctx.ellipse(cx + 22, 176, 4, 8, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // HUD Status Card
      ctx.fillStyle = lampOn ? "#fff" : "#282030";
      ctx.strokeStyle = lampOn ? "#ecd4be" : "#4b3c55";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(435, 75, 225, 150, 12);
      ctx.fill();
      ctx.stroke();

      drawMeter(450, 110, 195, 8, cat.happiness, "#ff7a94", "Happiness ♥");
      drawMeter(450, 150, 195, 8, cat.fullness, "#ffa444", "Fullness 🐟");
      drawMeter(450, 190, 195, 8, cat.energy, "#6ecaee", "Energy ⚡");

      // Status Bubble
      ctx.fillStyle = lampOn ? "#fff" : "#282030";
      ctx.beginPath();
      ctx.roundRect(40, 298, 605, 36, 8);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = lampOn ? "#483026" : "#f5ebe1";
      ctx.font = "13px Segoe UI";
      ctx.fillText(statusMessage, 54, 321);

      // Floating Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.font = "bold 13px Segoe UI";
        ctx.fillText(p.text, p.x, p.y);
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function loop() {
      animTimer += 0.04;
      fishSwim += 0.05;
      if (yarnBounce > 0) yarnBounce = Math.max(0, yarnBounce - 0.8);
      if (cat.moodTimer > 0) {
        cat.moodTimer--;
        if (cat.moodTimer === 0) cat.mood = 0;
      }
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
